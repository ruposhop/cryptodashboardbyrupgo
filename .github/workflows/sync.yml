# Sincronización cada hora (opcional y gratis). Vercel Cron, en el plan
# gratuito, solo se ejecuta una vez al día; este workflow llama a la misma
# ruta cada hora. Se activa solo si configuras en tu repo (Settings → Secrets
# and variables → Actions) los secretos SYNC_URL y CRON_SECRET. Ver README.
name: Sincronización cada hora

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Llamar a la sincronización
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SYNC_URL o CRON_SECRET no configurados: nada que hacer."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$SYNC_URL")
          echo "Respuesta: $code"
          [ "$code" = "200" ]
